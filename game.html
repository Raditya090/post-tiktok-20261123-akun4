<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ORBIT POST — Day 1 vs Day 7</title>
<style>
  html, body { margin: 0; padding: 0; background: #070b1e; overflow: hidden; }
  canvas { display: block; width: 1080px; height: 1920px; image-rendering: pixelated; }
</style>
</head>
<body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// ORBIT POST — Akun 4 (@pcrypto012), bounty day-one-day-seven.
// KREATIF: satu planet yang sama, kamera diam, tujuh hari berselang.
// Day 1: satu planet + satu kapal mengorbit. Day 7: planet/start sama +
// stasiun, sabuk asteroid, satelit, trail kapal, pod kargo.
// Semua gerak fungsi murni dari t (deterministik): window.renderAt(day, t)
// dipanggil capture headless; tanpa Date.now / Math.random di render.
const cv = document.getElementById('c');
const ctx = cv.getContext('2d');
ctx.imageSmoothingEnabled = false;

function mulberry32(a) {
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const rnd = mulberry32(20261123);
const STARS = [];
for (let i = 0; i < 160; i++) STARS.push([rnd() * 1080, rnd() * 1920, 1 + rnd() * 2.4, rnd()]);
const ROCKS = [];
for (let i = 0; i < 42; i++) ROCKS.push([rnd() * Math.PI * 2, 6 + rnd() * 14, 0.55 + rnd() * 0.9]);

const W = 1080, H = 1920;
const PX = 540, PY = 880;        // pusat planet — sama di kedua hari
const PR = 250;                  // radius planet — sama di kedua hari
const ORBIT_RX = 430, ORBIT_RY = 330; // orbit kapal — sama di kedua hari
const OMEGA = 0.32;              // kecepatan sudut kapal (rad/dtk)

function stars(day, t) {
  ctx.fillStyle = day === 1 ? '#070b1e' : '#0a0f2a';
  ctx.fillRect(0, 0, W, H);
  if (day === 7) { // nebula tipis day7
    const g = ctx.createRadialGradient(860, 300, 40, 860, 300, 520);
    g.addColorStop(0, 'rgba(120,80,200,0.28)');
    g.addColorStop(1, 'rgba(120,80,200,0)');
    ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  }
  for (const [sx, sy, sr, tw] of STARS) {
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 1.5 + tw * 6.28);
    ctx.fillStyle = '#ffffff';
    ctx.fillRect(sx, sy, sr, sr);
  }
  ctx.globalAlpha = 1;
}

function planet(day, t) {
  // atmosfer
  const g = ctx.createRadialGradient(PX, PY, PR * 0.8, PX, PY, PR * 1.35);
  g.addColorStop(0, 'rgba(90,160,255,0.35)');
  g.addColorStop(1, 'rgba(90,160,255,0)');
  ctx.fillStyle = g;
  ctx.beginPath(); ctx.arc(PX, PY, PR * 1.35, 0, Math.PI * 2); ctx.fill();
  // badan planet
  const pg = ctx.createRadialGradient(PX - 80, PY - 90, 40, PX, PY, PR);
  pg.addColorStop(0, '#7ec8f0'); pg.addColorStop(0.55, '#3e7ec2'); pg.addColorStop(1, '#1e4a8a');
  ctx.fillStyle = pg;
  ctx.beginPath(); ctx.arc(PX, PY, PR, 0, Math.PI * 2); ctx.fill();
  // pita awan (sama kedua hari, bergeser pelan dengan t)
  ctx.fillStyle = 'rgba(255,255,255,0.28)';
  for (let i = 0; i < 4; i++) {
    const by = PY - 130 + i * 72;
    const off = Math.sin(t * 0.2 + i) * 14;
    ctx.fillRect(PX - PR + 30 + off, by, PR * 1.55, 18);
  }
  // bayangan malam di sisi kanan
  ctx.fillStyle = 'rgba(4,8,24,0.45)';
  ctx.beginPath(); ctx.arc(PX + 70, PY + 20, PR * 0.92, -0.9, 1.2); ctx.fill();
  ctx.beginPath(); ctx.arc(PX, PY, PR, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(4,8,24,0.0)';
  // kawah
  ctx.fillStyle = 'rgba(255,255,255,0.16)';
  ctx.beginPath(); ctx.arc(PX - 90, PY + 60, 26, 0, Math.PI * 2); ctx.fill();
  ctx.beginPath(); ctx.arc(PX + 40, PY - 120, 18, 0, Math.PI * 2); ctx.fill();
}

function orbitPath() {
  ctx.strokeStyle = 'rgba(255,255,255,0.28)';
  ctx.lineWidth = 3; ctx.setLineDash([14, 18]);
  ctx.beginPath(); ctx.ellipse(PX, PY, ORBIT_RX, ORBIT_RY, 0, 0, Math.PI * 2); ctx.stroke();
  ctx.setLineDash([]);
}

function shipPos(t) {
  const a = -Math.PI / 2 + t * OMEGA;
  return [PX + Math.cos(a) * ORBIT_RX, PY + Math.sin(a) * ORBIT_RY, a];
}

function ship(day, t) {
  if (day === 7) { // trail: jejak posisi sebelumnya, memudar
    for (let k = 24; k >= 1; k--) {
      const [tx, ty] = shipPos(t - k * 0.09);
      ctx.globalAlpha = 0.55 * (1 - k / 24);
      ctx.fillStyle = '#ffd94a';
      ctx.fillRect(tx - 4, ty - 4, 8, 8);
    }
    ctx.globalAlpha = 1;
  }
  const [x, y, a] = shipPos(t);
  ctx.save(); ctx.translate(x, y); ctx.rotate(a + Math.PI / 2);
  ctx.fillStyle = '#e8e8e8';
  ctx.beginPath(); ctx.moveTo(0, -26); ctx.lineTo(16, 18); ctx.lineTo(-16, 18); ctx.closePath(); ctx.fill();
  ctx.fillStyle = '#d23b2e'; ctx.fillRect(-16, 6, 32, 8);
  ctx.fillStyle = '#ffd94a'; ctx.fillRect(-5, 18, 10, 12); // api pendorong
  ctx.restore();
}

function station(t) {
  // stasiun di sisi jauh orbit (kanan atas), posisi tetap
  const sx = 880, sy = 470;
  ctx.fillStyle = '#c8c8d0';
  ctx.fillRect(sx - 90, sy - 16, 180, 32); // badan
  ctx.fillStyle = '#3e7ec2';
  ctx.fillRect(sx - 30, sy - 46, 60, 92); // hub
  ctx.fillStyle = '#2a4a8a'; // panel surya
  ctx.fillRect(sx - 190, sy - 10, 90, 20);
  ctx.fillRect(sx + 100, sy - 10, 90, 20);
  ctx.fillStyle = '#ffd94a';
  for (let i = 0; i < 4; i++) ctx.fillRect(sx - 186 + i * 22, sy - 10, 4, 20);
  for (let i = 0; i < 4; i++) ctx.fillRect(sx + 104 + i * 22, sy - 10, 4, 20);
  // lampu suar berkedip
  const blink = (Math.sin(t * 3) + 1) / 2;
  ctx.globalAlpha = 0.4 + 0.6 * blink;
  ctx.fillStyle = '#ff4d4d';
  ctx.beginPath(); ctx.arc(sx, sy - 56, 9, 0, Math.PI * 2); ctx.fill();
  ctx.globalAlpha = 1;
  // antena
  ctx.fillStyle = '#888'; ctx.fillRect(sx + 40, sy - 70, 4, 30);
}

function asteroids(t) {
  for (const [a0, size, speed] of ROCKS) {
    const a = a0 + t * 0.02 * speed;
    const rx = 560, ry = 460;
    const x = PX + Math.cos(a) * rx;
    const y = PY + Math.sin(a) * ry;
    ctx.fillStyle = '#8a7a66';
    ctx.fillRect(x - size * 3, y - size * 2, size * 6, size * 4);
    ctx.fillStyle = '#6b5d4c';
    ctx.fillRect(x - size * 3, y + size, size * 6, size);
  }
}

function satellites(t) {
  // 2 satelit di orbit dalam, lebih cepat
  for (let k = 0; k < 2; k++) {
    const a = -Math.PI / 2 + t * 0.8 + k * Math.PI;
    const x = PX + Math.cos(a) * 330, y = PY + Math.sin(a) * 240;
    ctx.fillStyle = '#d8d8e0'; ctx.fillRect(x - 14, y - 8, 28, 16);
    ctx.fillStyle = '#2a4a8a'; ctx.fillRect(x - 34, y - 4, 20, 8); ctx.fillRect(x + 14, y - 4, 20, 8);
    ctx.fillStyle = '#ff4d4d';
    ctx.globalAlpha = 0.5 + 0.5 * Math.sin(t * 4 + k * 2);
    ctx.beginPath(); ctx.arc(x, y - 12, 4, 0, Math.PI * 2); ctx.fill();
    ctx.globalAlpha = 1;
  }
}

function pods(t) {
  // 3 pod kargo melayang dekat stasiun
  const list = [[700, 620, 0.3], [790, 700, 0.5], [660, 760, 0.7]];
  for (const [bx, by, ph] of list) {
    const y = by + Math.sin(t * 0.8 + ph * 6) * 12;
    ctx.fillStyle = '#f2a541'; ctx.fillRect(bx - 26, y - 16, 52, 32);
    ctx.fillStyle = '#8a5a2b'; ctx.fillRect(bx - 26, y - 16, 52, 8);
    ctx.fillStyle = '#2c2c2c'; ctx.font = 'bold 20px monospace';
    ctx.textAlign = 'center'; ctx.fillText('POD', bx, y + 8); ctx.textAlign = 'left';
  }
}

function hud(day, t) {
  ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = 'rgba(10,16,40,0.6)'; ctx.fillRect(36, 36, 560, 128);
  ctx.fillStyle = '#ffffff'; ctx.font = 'bold 64px monospace';
  ctx.fillText(day === 1 ? 'DAY 1' : 'DAY 7', 60, 108);
  ctx.font = 'bold 34px monospace';
  ctx.fillStyle = '#ffe9a8';
  ctx.fillText('ORBIT POST', 60, 148);
  if (day === 7) {
    ctx.fillStyle = 'rgba(10,16,40,0.6)'; ctx.fillRect(664, 36, 380, 128);
    ctx.fillStyle = '#7ed491'; ctx.font = 'bold 38px monospace';
    ctx.fillText('STATION ONLINE', 688, 92);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 34px monospace';
    ctx.fillText('CARGO 3/3 · 2 SATS', 688, 140);
  }
  if (day === 7 && t >= 5.0) {
    ctx.fillStyle = 'rgba(10,16,40,0.7)'; ctx.fillRect(140, 1780, 800, 90);
    ctx.fillStyle = '#ffffff'; ctx.font = 'bold 46px monospace';
    ctx.textAlign = 'center';
    ctx.fillText('Start yours at make.fun', 540, 1840);
    ctx.textAlign = 'left';
  }
}

function renderAt(day, t) {
  ctx.clearRect(0, 0, W, H);
  stars(day, t);
  if (day === 7) asteroids(t);
  orbitPath();
  planet(day, t);
  if (day === 7) { station(t); satellites(t); pods(t); }
  ship(day, t);
  hud(day, t);
}

window.renderAt = renderAt;
renderAt(1, 0);
</script>
</body>
</html>
